<ion-content [fullscreen]="true">

  <!-- Ola de cabecera -->
  <div class="wave-header">
    <div class="brand-area">
      <div class="icon-box">📦</div>
      <h1 class="brand">Bienvenido</h1>
      <p class="subtitle">DESPACHO · sistema de productividad</p>
    </div>
    <svg class="wave-svg" viewBox="0 0 375 72" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,36 C60,72 160,4 280,42 C330,58 360,30 375,20 L375,72 L0,72 Z" fill="#0D0F14"/>
    </svg>
  </div>

  <!-- Formulario -->
  <div class="login-card">

    <!-- Username -->
    <div class="field">
      <span class="field-label">Usuario</span>
      <div class="input-row">
        <span class="field-icon">👤</span>
        <input
          type="text"
          [(ngModel)]="username"
          placeholder="Nombre de usuario"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
        />
      </div>
    </div>

    <!-- PIN dots -->
    <div class="pin-section">
      <span class="field-label">PIN</span>
      <div class="dots" [class.shake]="shake">
        @for (i of dots; track i) {
          <div class="dot" [class.filled]="pin.length > i"></div>
        }
      </div>
    </div>

    <!-- Recordarme -->
    <div class="remember-row" (click)="toggleRecordarme()">
      <div class="checkbox" [class.checked]="recordarme">
        @if (recordarme) { <span class="check-mark">✓</span> }
      </div>
      <span class="remember-label">Recordar usuario y PIN</span>
    </div>

    <!-- Error -->
    @if (error) {
      <p class="error-msg">{{ error }}</p>
    }

    <!-- Numpad -->
    <div class="numpad">
      @for (key of numKeys; track $index) {
        @if (key.num) {
          <button
            type="button"
            class="key"
            [class.key-del]="key.num === '⌫'"
            (click)="presionarTecla(key.num)"
            [disabled]="loading"
          >
            <span class="key-num">{{ key.num }}</span>
            @if (key.letters) {
              <span class="key-letters">{{ key.letters }}</span>
            }
          </button>
        } @else {
          <div class="key-empty"></div>
        }
      }
    </div>

    <!-- CTA -->
    <button
      type="button"
      class="cta"
      (click)="submit()"
      [disabled]="loading || !username.trim() || pin.length < 4"
    >
      {{ loading ? 'Verificando...' : 'Iniciar sesión' }}
    </button>

    <!-- Link -->
    <p class="link-row">
      ¿Primera vez?&nbsp;<a routerLink="/registro">Crear cuenta →</a>
    </p>

  </div>

</ion-content>
