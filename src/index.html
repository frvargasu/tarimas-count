<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Ionic App</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />
  <link rel="manifest" href="manifest.webmanifest" />

  <!-- PWA iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Despacho">
  <link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">

  <!-- PWA Android / General -->
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon/icon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon/icon-512x512.png">

  <!-- Theme color -->
  <meta name="theme-color" content="#00E5A0">
  <meta name="msapplication-TileColor" content="#0D0F14">

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
</head>

</body>

</html>
